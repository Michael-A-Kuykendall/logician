name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Cross-platform: Z3 on every OS ──
  test-z3:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ matrix.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Install Z3
        run: >
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update && sudo apt-get install -y z3
          elif [ "$RUNNER_OS" = "macOS" ]; then
            brew install z3
          elif [ "$RUNNER_OS" = "Windows" ]; then
            choco install z3
          fi
        shell: bash
      - name: Check
        run: cargo check --all-features
      - name: Clippy
        run: cargo clippy --all-features -- -D warnings
      - name: Test (default)
        run: cargo test -- --test-threads=1
      - name: Test (tokio)
        run: cargo test --features tokio -- --test-threads=1
      - name: Doc
        run: cargo doc --no-deps

  # ── Solver matrix on Ubuntu ──
  test-other-solvers:
    strategy:
      fail-fast: false
      matrix:
        solver: [cvc5, yices2]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ubuntu-${{ matrix.solver }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Install ${{ matrix.solver }}
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.solver }}
      - name: Test (default)
        run: cargo test -- --test-threads=1

  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format check
        run: cargo fmt --check
